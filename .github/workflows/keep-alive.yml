name: Supabase Keep-Alive
on:
  schedule:
    # Corre cada 3 días a las 10:00 UTC (margen de seguridad frente a la ventana de ~7 días de inactividad)
    - cron: '0 10 */3 * *'
  workflow_dispatch: # permite correrlo manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase DB (real query)
        run: |
          curl -f -s \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          "${{ secrets.SUPABASE_URL }}/rest/v1/properties?select=id&limit=1" \
          && echo "✅ DB con actividad real" \
          || (echo "❌ Ping fallido - revisar si el proyecto está pausado" && exit 1)
