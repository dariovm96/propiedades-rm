name: Supabase Keep-Alive

on:
  schedule:
    # Corre cada 5 días a las 10:00 UTC
    - cron: '0 10 */5 * *'
  workflow_dispatch: # permite correrlo manualmente

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        run: |
          curl -f -s \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          "${{ secrets.SUPABASE_URL }}/auth/v1/health" \
          && echo "✅ Supabase activo" \
          || (echo "❌ Ping fallido" && exit 1)
